<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heinola Winter Party 2026</title>

    :root {
      --bg-dark: #090d16;
      --bg-card: rgba(22, 28, 45, 0.75);
      --bg-card-hover: rgba(30, 39, 64, 0.85);
      --primary: #00f2fe;
      --primary-glow: rgba(0, 242, 254, 0.4);
      --secondary: #4facfe;
      --accent-pink: #ff2a85;
      --accent-purple: #8a2be2;
      --text-main: #f0f4f8;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.12);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    /* Ambient Glow Background & Snow Effect */
    .bg-glow-1 {
      position: fixed;
      top: -10%;
      left: -20%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, var(--accent-purple) 0%, rgba(0,0,0,0) 70%);
      opacity: 0.35;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }

    .bg-glow-2 {
      position: fixed;
      bottom: 10%;
      right: -20%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, var(--primary) 0%, rgba(0,0,0,0) 70%);
      opacity: 0.25;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }

    .snow-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .snowflake {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      opacity: 0.6;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-10px) translateX(0);
      }
      100% {
        transform: translateY(105vh) translateX(30px);
      }
    }

    .app-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 16px;
      position: relative;
      z-index: 2;
    }
